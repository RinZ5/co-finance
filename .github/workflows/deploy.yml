name: Deploy on VM

on:
  push:
    branches: [main, feature/deployment]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with: { go-version: "1.24" }

      - name: Build Go Binaries
        run: |
          # Build Backend
          cd backend
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ../backend_main ./cmd/server
          cd ..

          # Build Gateway
          cd gateway
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ../gateway_main .

      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: "20" }

      - name: Build Vue App
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Create .env
        run: |
          echo "FINNHUB_API_KEY=${{ secrets.FINNHUB_API_KEY }}" > .env
          echo "GATEWAY_SECRET=${{ secrets.GATEWAY_SECRET }}" >> .env
          echo "FINNHUB_WS_URL=ws://gateway:8081/ws" >> .env
          echo "ALLOWED_ORIGINS=http://localhost:30,http://${{ secrets.HOST }}:30" >> .env

      - name: Copy Files
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: 22
          target: "/home/${{ secrets.USERNAME }}/deploy-temp"
          source: "backend_main,gateway_main,frontend/dist,frontend/nginx.conf,backend/Dockerfile.prod,frontend/Dockerfile.prod,gateway/Dockerfile.prod,docker-compose.prod.yml,.env"

      - name: Deploy on Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: 22
          script: |
            # 1. Create Structure
            mkdir -p ~/co-finance/backend
            mkdir -p ~/co-finance/frontend
            mkdir -p ~/co-finance/gateway  # New Folder

            # 2. Move Backend
            mv ~/deploy-temp/backend_main ~/co-finance/backend/main
            mv ~/deploy-temp/backend/Dockerfile.prod ~/co-finance/backend/Dockerfile.prod
            chmod +x ~/co-finance/backend/main

            # 3. Move Gateway (New)
            mv ~/deploy-temp/gateway_main ~/co-finance/gateway/gateway_main
            mv ~/deploy-temp/gateway/Dockerfile.prod ~/co-finance/gateway/Dockerfile.prod
            chmod +x ~/co-finance/gateway/gateway_main

            # 4. Move Frontend
            rm -rf ~/co-finance/frontend/dist
            mv ~/deploy-temp/frontend/dist ~/co-finance/frontend/dist
            mv ~/deploy-temp/frontend/Dockerfile.prod ~/co-finance/frontend/Dockerfile.prod
            mv ~/deploy-temp/frontend/nginx.conf ~/co-finance/frontend/nginx.conf

            # 5. Move Configs
            mv ~/deploy-temp/docker-compose.prod.yml ~/co-finance/docker-compose.prod.yml
            mv ~/deploy-temp/.env ~/co-finance/.env

            rm -rf ~/deploy-temp

            # 6. Restart Docker
            cd ~/co-finance
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

            docker image prune -f
